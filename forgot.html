<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - Bank Sampah</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <!-- Kiri: Ilustrasi -->
    <div class="left-panel">
      <h1>Lupa Password?</h1>
      <p>Tenang, kami bantu reset agar kamu bisa kembali masuk 🌿</p>
      <img src="images/sampahimut.png" alt="Ilustrasi tanaman">
    </div>

    <!-- Kanan: Form Reset -->
    <div class="right-panel">
      <div class="form-box">
        <h2>Reset Password</h2>
        <form>
          <label for="email">Email / Username</label>
          <input type="text" id="email" placeholder="firza123 atau firza@email.com">

          <button type="submit">Kirim Tautan Reset</button>
        </form>

        <div class="links">
          <a href="login.html">← Kembali ke Login</a>
          <a href="index.html">← Kembali ke Beranda</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
