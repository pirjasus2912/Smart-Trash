  <section class="kontak">
    <h1>Kontak Kami</h1>
    <p>Ingin bergabung, bertanya, atau berkolaborasi? Kami siap mendengar!</p>

    <ul>
      <li>Email: smarttrash@gmail.com</li>
      <li>WhatsApp: +62 812-3456-7890</li>
      <li>Alamat: Jl. Bersih No. 10, Bogor Selatan, Jawa Barat</li>
    </ul>

    <form class="form-kontak">
      <label>Nama:</label>
      <input type="text" name="nama" required>

      <label>Email:</label>
      <input type="email" name="email" required>

      <label>Pesan:</label>
      <textarea name="pesan" rows="5" required></textarea>

      <button type="submit">Kirim Pesan</button>
      <div id="pesan-terkirim" style="display: none; margin-top: 20px; color: green; font-weight: bold;"></div>

    </form>
  </section>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector(".form-kontak");
    const pesanBox = document.getElementById("pesan-terkirim");

    form.addEventListener("submit", function (e) {
      e.preventDefault(); // Mencegah reload halaman

      // Simulasi pengiriman
      setTimeout(() => {
        pesanBox.textContent = "✅ Pesan kamu telah berhasil dikirim! Terima kasih atas partisipasimu dalam menjaga lingkungan 🌿";
        pesanBox.style.display = "block";
        form.reset(); // Kosongkan form
      }, 500);
    });
  });
</script>
