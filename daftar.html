<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun - Bank Sampah</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h1>Gabung Bank Sampah</h1>
      <p>Daftar sekarang dan mulai kelola sampah jadi manfaat 🌿</p>
      <img src="images/sampahimut.png" alt="Ilustrasi tanaman">
    </div>

    <div class="right-panel">
      <div class="form-box">
        <h2>Buat Akun Baru</h2>
        <form id="signupForm">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" placeholder="Contoh: Olivia">

          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Olivia123">

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Olivia@email.com">

          <label for="password">Password</label>
          <input type="password" id="password" placeholder>

          <div id="signupError" class="error-message"></div>
          <button type="submit">Daftar</button>
        </form>

        <div class="links">
          <a href="login.html">Sudah punya akun? Login</a>
          <a href="index.html">← Kembali ke Beranda</a>
        </div>
      </div>
    </div>
  </div>

  <script src="daftar.js" defer></script>
</body>
</html>
